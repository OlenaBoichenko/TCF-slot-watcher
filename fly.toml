# fly.toml app configuration file generated for slot-watcher on 2026-09-17T13:00:45-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'slot-watcher'
primary_region = 'sjc'

[build]
[env]
  DB_PATH = '/data/slots.db'
  TICK_SECONDS = '15'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[checks]
  [checks.health]
    port = 8000
    type = 'http'
    interval = '1m0s'
    timeout = '10s'
    grace_period = '20s'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
